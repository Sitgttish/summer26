[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "etap-clf"
version = "0.1.2"
description = "ESM3-based Transformer Attention Protein classifier for binary protein sequence classification"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Jianyu Ren", email = "jianyurdennis@gmail.com"},
]
keywords = ["protein", "bioinformatics", "deep-learning", "ESM3", "transformer", "classification"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "esm",
    "biopython>=1.79",
    "h5py>=3.0",
    "numpy>=1.21",
    "pandas>=1.3",
    "scikit-learn>=1.0",
    "matplotlib>=3.5",
    "seaborn>=0.12",
    "umap-learn>=0.5",
    "tqdm>=4.0",
    "huggingface-hub>=0.16",
]

[project.scripts]
etap = "etap.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["etap*"]
