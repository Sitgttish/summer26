[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eta-clf"
version = "0.1.0"
description = "ESM3-based Transformer Attention classifier for protein binary classification"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "torch>=2.0",
    "esm",
    "biopython>=1.79",
    "h5py>=3.0",
    "numpy>=1.21",
    "pandas>=1.3",
    "scikit-learn>=1.0",
    "matplotlib>=3.5",
    "seaborn>=0.12",
    "umap-learn>=0.5",
    "tqdm>=4.0",
    "huggingface-hub>=0.16",
]

[project.scripts]
eta = "eta.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["eta*"]
